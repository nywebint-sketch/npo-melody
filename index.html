<!DOCTYPE html>
<html lang="ru">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co; script-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline' blob: data:; font-src 'self' data: blob:; img-src 'self' https: data:; media-src 'self' https: blob: data:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://rutube.ru https://*.supabase.co; connect-src 'self' https://*.supabase.co https://httpbin.org; form-action 'self'; base-uri 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>НПО Мелодия</title>
  <meta name="description"
    content="НПО Мелодия — клуб / лейбл / трансляции. Афиша, артисты, релизы, подкасты, live, шоп.">

  <!-- Базовый URL сайта: при своём домене замени href во всех meta ниже + canonical -->
  <link rel="canonical" href="https://nywebint-sketch.github.io/npo-melody/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="НПО Мелодия">
  <meta property="og:title" content="НПО Мелодия">
  <meta property="og:description"
    content="НПО Мелодия — клуб / лейбл / трансляции. Афиша, артисты, релизы, подкасты, live, шоп.">
  <meta property="og:url" content="https://nywebint-sketch.github.io/npo-melody/">
  <meta property="og:image"
    content="https://rvswpgsxutfcpgvmzonr.supabase.co/storage/v1/object/public/images/logo%20white.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="НПО Мелодия">
  <meta name="twitter:description"
    content="НПО Мелодия — клуб / лейбл / трансляции. Афиша, артисты, релизы, подкасты, live, шоп.">
  <meta name="twitter:image"
    content="https://rvswpgsxutfcpgvmzonr.supabase.co/storage/v1/object/public/images/logo%20white.png">

  <link rel="icon" href="https://rvswpgsxutfcpgvmzonr.supabase.co/storage/v1/object/public/images/logo%20white.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
</head>

<body class="hero-fullscreen">
  <header class="topbar">
    <div class="container">
      <div class="in">
        <div class="brand">
          <button class="brand-mark menu-toggle" id="mobileMenuToggle" type="button" aria-label="Открыть меню"
            aria-expanded="false">
            <picture>
              <source media="(prefers-color-scheme: dark)"
                srcset="https://rvswpgsxutfcpgvmzonr.supabase.co/storage/v1/object/public/images/logo%20white.png">
              <img src="https://rvswpgsxutfcpgvmzonr.supabase.co/storage/v1/object/public/images/logo%20black.png"
                alt="Логотип НПО Мелодия" width="132" height="132">
            </picture>
          </button>
        </div>
      </div>
    </div>
  </header>
  <div class="mobile-menu-backdrop" id="mobileMenuBackdrop" hidden></div>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Навигация по сайту" hidden>
    <a href="#streams">Live</a>
    <a href="#events">Афиша</a>
    <a href="#artists">Артисты</a>
    <a href="#merch">Шоп</a>
    <a href="#releases">Релизы</a>
    <a href="#profile" class="auth-open-button">войти</a>
    <button type="button" class="nav-club-logout" hidden aria-label="Выйти из аккаунта">выйти</button>
  </nav>

  <main>

    <section class="intro-start" id="home">
      <img
        class="intro-start-image"
        src="https://rvswpgsxutfcpgvmzonr.supabase.co/storage/v1/object/public/images/npo_print_source.png"
        alt="НПО Мелодия — главная обложка"
        fetchpriority="high"
        decoding="async"
      >
    </section>

    <section id="streams">
      <div class="container">
        <div class="head">
          <div>
            <h2>Live</h2>
          </div>
        </div>

        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <p id="streamsLiveCount" class="streams-live-meta muted" aria-live="polite"></p>
            <div class="grid streams-live-grid" id="streamsLiveList" role="list" aria-label="Предстоящие эфиры"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="events">
      <div class="container">
        <div class="head">
          <div>
            <h2>Афиша</h2>
          </div>
        </div>

        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <div class="grid g4" id="eventsGrid"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="artists">
      <div class="container">
        <div class="head">
          <div>
            <h2>Артисты</h2>
          </div>
        </div>

        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <div class="grid g3" id="artistsGrid"></div>
          </div>
        </div>

      </div>
    </section>

    <section id="merch">
      <div class="container">
        <div class="head">
          <div>
            <h2>Шоп</h2>
          </div>
        </div>

        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <div class="grid g4" id="merchGrid"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Эксклюзив: временно скрыт (см. renderClubAccess в script.js) -->
    <section id="exclusive" hidden>
      <div class="container">
        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <div class="streams-exclusive-block">
              <div class="streams-col">
                <div
                  id="exclusiveHint"
                  class="card pad open-card streams-hint-row"
                  role="button"
                  tabindex="0"
                  aria-expanded="false"
                  aria-controls="exclusivePanel"
                  aria-label="Эксклюзив"
                >
                  <div class="row sp">
                    <b>Эксклюзив</b>
                    <span class="tag">→</span>
                  </div>
                </div>
                <div id="exclusivePanel" class="card streams-panel" role="region" aria-label="Эксклюзив" hidden aria-hidden="true">
                  <div class="modal-header streams-panel-header">
                    <div class="modal-header-text">
                      <div class="modal-title">Эксклюзив</div>
                    </div>
                    <button class="btn ghost modal-close" id="exclusiveCloseBtn" type="button" aria-label="Закрыть">
                      <svg class="modal-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
                        <path d="M6 6l12 12M18 6L6 18"/>
                      </svg>
                    </button>
                  </div>
                  <div class="pad streams-panel-body">
                    <div id="exclusiveContent" class="exclusive-list"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="releases">
      <div class="container">
        <div class="head">
          <div>
            <h2>Релизы</h2>
          </div>
        </div>

        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <div class="grid g4" id="releasesGrid"></div>
          </div>
        </div>

      </div>
    </section>

    <section id="profile">
      <div class="container">
        <div class="head">
          <div>
            <h2>Профиль</h2>
          </div>
        </div>

        <div class="card catalog-block">
          <div class="pad catalog-block__pad">
            <div class="card pad">
            <b>Аккаунт участника</b>
            <div class="divider"></div>

            <div id="authGuest" class="grid auth-forms login-register-buttons">
              <form id="loginForm" class="auth-form login-form">
                <b>Вход</b>
                <input class="input" name="email" type="email" placeholder="Email" required>
                <input class="input" name="password" type="password" placeholder="Пароль" required>
                <button class="btn" type="submit">Войти</button>
              </form>

              <form id="registerForm" class="auth-form register-form">
                <b>Регистрация</b>
                <input class="input" name="name" placeholder="Имя" required>
                <input class="input" name="email" type="email" placeholder="Email" required>
                <input class="input" name="password" type="password" placeholder="Пароль (мин. 6 символов)" required>
                <input class="input" name="password2" type="password" placeholder="Повтори пароль" required>
                <button class="btn primary" type="submit">Создать аккаунт</button>
              </form>
            </div>

            <div id="authMember" class="auth-member" hidden>
              <div class="muted">Ты вошел как <b id="memberName">—</b>.</div>
              <div style="height:10px"></div>
              <button class="btn" id="logoutBtn" type="button">Выйти</button>
            </div>

            <div id="authStatus" class="muted auth-status">Доступ к эксклюзиву закрыт.</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <div class="container">
        <div class="row footer-socials">
          <a class="btn" href="#" data-placeholder-link="Поставь ссылку">Telegram</a>
          <a class="btn" href="https://www.instagram.com/npo_melody/" target="_blank"
            rel="noopener noreferrer">Instagram</a>
          <a class="btn" href="#" data-placeholder-link="Поставь ссылку">SoundCloud</a>
        </div>
        <div class="footer-address muted">Москва, 3-я улица Ямского Поля, 2к5А</div>
        <div>© <span id="year">2026</span> НПО Мелодия</div>
      </div>
    </footer>

  </main>

  <div id="modal" class="modal-overlay" aria-hidden="true">
    <div class="modal-inner">
      <div class="modal-header">
        <div class="modal-header-text">
          <div id="mTitle" class="modal-title">—</div>
          <div id="mSub" class="modal-sub">—</div>
        </div>
        <button class="btn ghost modal-close" id="mClose" type="button" aria-label="Закрыть">
          <svg class="modal-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body pad" id="mBody"></div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>

</body>

</html>
